name: Docker Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-api
          push: true
          tags: sanjeev1208/backend-api:latest

      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx-proxy
          push: true
          tags: sanjeev1208/nginx-proxy:latest

      - name: Build and push monitor image
        uses: docker/build-push-action@v5
        with:
          context: ./monitor-service
          push: true
          tags: sanjeev1208/monitor-service:latest

      - name: Build and push log-analyzer image
        uses: docker/build-push-action@v5
        with:
          context: ./log-analyzer
          push: true
          tags: sanjeev1208/log-analyzer:latest