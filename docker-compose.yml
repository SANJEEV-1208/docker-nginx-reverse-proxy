services:
  backend:
    build: ./backend-api
    container_name: backend-container
    expose:
      - "5000"

  nginx:
    build: ./nginx-proxy
    container_name: nginx-container
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - nginx-logs:/var/log/nginx

  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: monitoring
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  monitor:
    build: ./monitor-service
    container_name: monitor-container
    depends_on:
      - postgres
    expose:
      - "6000"

  log-analyzer:
    build: ./log-analyzer
    container_name: log-analyzer-container
    depends_on:
      - postgres
    volumes:
      - nginx-logs:/var/log/nginx:ro
    expose:
      - "7000"

volumes:
  pgdata:
  nginx-logs: